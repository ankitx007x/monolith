<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monolith — Community Medicine</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #f0f0f0;
            --border-color: rgba(255, 255, 255, 0.25);
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            padding: 0 20px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Fixed Background Layer */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: 
                linear-gradient(
                    to bottom, 
                    rgba(0, 0, 0, 0.35) 0%, 
                    rgba(0, 0, 0, 0.1) 40%, 
                    rgba(10, 10, 10, 0.88) 100%
                ),
                url('https://image.tmdb.org/t/p/original/5KUuS3IabB50qo5mpKom10pKZly.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: brightness(1.15) contrast(1.05);
            pointer-events: none;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-family: var(--font-mono);
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.2rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.9);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-family: var(--font-mono);
            transition: color 0.2s ease;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.9);
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* Main Container */
        main {
            max-width: 800px;
            width: 100%;
            margin: 60px auto 40px auto;
        }

        /* Header Section */
        .subject-header {
            margin-bottom: 30px;
        }

        .breadcrumb {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .breadcrumb a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .breadcrumb a:hover {
            color: #ffffff;
        }

        h1 {
            font-size: 3rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.98), 0 0 6px rgba(0, 0, 0, 0.9);
        }

        /* Topic List Container */
        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Glassmorphic Interaction Cards */
        .topic-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(10, 10, 10, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .topic-row:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.7),
                0 0 20px rgba(255, 255, 255, 0.25);
        }

        .topic-title {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .topic-arrow {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--accent-color);
            transition: transform 0.2s ease, color 0.2s ease;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .topic-row:hover .topic-arrow {
            color: #ffffff;
            transform: translateX(5px);
        }

        /* Footer */
        footer {
            max-width: 800px;
            width: 100%;
            margin: 60px auto 30px auto;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-color);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Monolith</div>
        <ul class="nav-links">
            <li><a href="https://fidelioa.github.io/monolith">Home</a></li>
            <li><a href="https://fidelioa.github.io/monolith/archives">Archives</a></li>
            <li><a href="https://fidelioa.github.io/monolith/about">About</a></li>
        </ul>
    </nav>

    <main>

        <section class="content">

                <a href="https://fidelioa.github.io/monolith/archives/commed/tuberculosis" class="topic-row">

                    <span class="topic-arrow">&rarr;</span>

                <a href="https://fidelioa.github.io/monolith/archives/commed/flu" class="topic-row">

                <a href="https://fidelioa.github.io/monolith/archives/commed/covid" class="topic-row">

                 <a href="https://fidelioa.github.io/monolith/archives/commed/respiratory-tract-infections" class="topic-row">

                <a href="https://fidelioa.github.io/monolith/archives/commed/measles" class="topic-row">

                <a href="https://fidelioa.github.io/monolith/archives/commed/chicken-pox" class="topic-row">

                </a>

                <a href="https://fidelioa.github.io/monolith/archives/commed/diphtheria" class="topic-row">
                    <span class="topic-title">Diphtheria</span>
                    <span class="topic-arrow">&rarr;</span>
                </a>

                <a href="https://fidelioa.github.io/monolith/archives/commed/whooping-cough" class="topic-row">
                    <span class="topic-title">Whooping Cough</span>

                </a>

                <a href="https://fidelioa.github.io/monolith/archives/commed/dengue" class="topic-row">
                    <span class="topic-title">Dengue</span>

                </a>

                <a href="https://fidelioa.github.io/monolith/archives/commed/malaria" class="topic-row">

                </a>

                <a href="https://fidelioa.github.io/monolith/archives/commed/lymphatic-filariasis" class="topic-row">

                    <span class="topic-arrow">&rarr;</span>
                </a>

                <a href="https://fidelioa.github.io/monolith/archives/commed/kalazar" class="topic-row">
                    <span class="topic-title">Kalazar</span>
                    <span class="topic-arrow">&rarr;</span>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MONOLITH. Built to persist.</p>
    </footer>

</body>
</html>
